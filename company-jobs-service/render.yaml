services:
  - type: web
    name: compass-company-jobs-service
    runtime: python
    plan: free
    rootDir: company-jobs-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOWED_ORIGINS
        value: "https://abhinavsarkar101.github.io"
      - key: PER_SOURCE_TIMEOUT_SECONDS
        value: "22"
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "120"
